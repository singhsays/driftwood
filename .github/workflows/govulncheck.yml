name: govulncheck

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
