# driftwood config — example
# Nodes are fetched over SSH; artifacts land in the git output repo.

defaults:
  user: root
  interval: 24h
  keyfile: ~/.ssh/id_ed25519

nodes:
  # Built-in models know what to fetch for a product.
  - name: switch
    model: routeros
    host: switch.lan

  - name: gateway
    model: opnsense
    host: gateway.lan

  - name: hypervisor
    model: proxmox
    host: pve.lan

  # The generic model fetches whatever you specify — works for
  # anything reachable over SSH.
  - name: nas
    model: generic
    host: nas.lan
    files:
      - /etc/smb4.conf
      - /etc/exportfs
    commands:
      - cat /etc/version
